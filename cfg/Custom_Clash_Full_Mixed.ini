ruleset=🎯 全球直连,[]GEOIP,cn,no-resolve
;以上兜底规则会根据实际情况随时取消
;PT/BT 优化开启会使 80/443 以外端口的流量直连
ruleset=🔀 非标端口,clash-classic:https://testingcf.jsdelivr.net/gh/GinatWiki/Custom_OpenClash_Rules@main/rule/Custom_Port_Direct.yaml,28800
;国内冷门域名会命中漏网之鱼，如影响使用，请设置漏网之鱼直连
;漏网之鱼直连时，无法通过 DNS 泄露测试，但是并不存在泄露
ruleset=🎨 E-Hentai,[]GEOSITE,ehentai
ruleset=🖼 Pawchive,[]DOMAIN-SUFFIX,pawchive.st
ruleset=🖌 Civitai,[]DOMAIN-KEYWORD,civitai
ruleset=🖌 Pixiv,[]GEOSITE,pixiv
ruleset=⏬ Pikpak,[]GEOSITE,pikpak
ruleset=🐟 漏网之鱼,[]FINAL
;设置规则标志位结束

;设置节点分组标志位
