;Custom_OpenClash_Rules
;全分组防 DNS 泄漏订阅转换模板
;作者：https://github.com/Aethersailor
;项目地址：https://github.com/Aethersailor/Custom_OpenClash_Rules
;基于 ACL4SSR 模板魔改而来，感谢原作者！
;<建议>搭配本项目配套设置，实现最佳化的 OpenClash 使用效果！
;设置方案：https://github.com/Aethersailor/Custom_OpenClash_Rules/wiki/OpenClash-%E8%AE%BE%E7%BD%AE%E6%96%B9%E6%A1%88

;本模板为 GinatWiki fork 自定义模板：Full 规则 + 地区 x 倍率（普通/0.1倍/0.01倍）分组，自动组置顶
;规则部分跟随上游 Custom_Clash_Full.ini（Aethersailor），分组部分为 fork 自定义
;本 Mixed 版在 Rate 版基础上为双订阅设计：第 1 个订阅为 rate 主订阅（GROUPID=0），第 2 个订阅为谷歌专用订阅（GROUPID=1），顺序不可颠倒
;谷歌系分组（YouTube/谷歌FCM/谷歌服务）默认出口走第二订阅全部节点组成的 🌟 谷歌智能 组，其余分组默认仍只含主订阅节点

[custom]
;设置规则标志位
;以下规则，按照从上往下的顺序遍历，优先命中上位规则，规则重复无影响
;修改顺序会影响分流效果

;本地地址和域名直连
ruleset=🎯 全球直连,[]GEOSITE,private
ruleset=🎯 全球直连,[]GEOIP,private,no-resolve
;本项目收录的直连规则
ruleset=🎯 全球直连,clash-domain:https://testingcf.jsdelivr.net/gh/GinatWiki/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.mrs,28800
ruleset=🎯 全球直连,clash-classic:https://testingcf.jsdelivr.net/gh/GinatWiki/Custom_OpenClash_Rules@main/rule/Custom_Direct_Classical_IP.yaml,28800
;本项目收录的代理规则
ruleset=🚀 手动选择,clash-domain:https://testingcf.jsdelivr.net/gh/GinatWiki/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Domain.mrs,28800
ruleset=🚀 手动选择,clash-classic:https://testingcf.jsdelivr.net/gh/GinatWiki/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Classical_IP.yaml,28800
;谷歌在国内可用的域名直连
ruleset=🎯 全球直连,[]GEOSITE,google-cn
;国内游戏域名直连
